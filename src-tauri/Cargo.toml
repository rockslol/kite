[package]
name = "kite"
version = "0.3.0"
description = "A lightweight music player for YouTube, SoundCloud and local files"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
percent-encoding = "2"
sha2 = "0.10"
souvlaki = "0.9.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
lofty = "0.25.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
notify = "8"
tauri-plugin-global-shortcut = "2"
md5 = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
